<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Cards</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <h1>OUR PRICING PLANS</h1>
    </header>
    <div class="pricing-container">
      <div class="pricing-card popular">
            <h2>Basic Plan</h2>
           <p>$9.99/month</p>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
            </ul>
            <button>Subscribe now</button>
        </div>
        <div class="pricing-card">
            <h2>Standard Plan</h2>
            <p>$19.99/month</p>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
            <li>Feature 4</li>
            </ul>
            <button>Subscribe now</button>
        </div>
        <div class="pricing-card">
            <h2>Premium Plan</h2>
            <p>$29.99/month</p>
            <ul>
                <li>Feature 1</li>
                <li>Feature 2</li>
                <li>Feature 3</li>
                <li>Feature 4</li>
                <li>Feature 5</li>
            </ul>
            <button>Subscribe now</button>
        </div>
    </div>
</body>
</html>
