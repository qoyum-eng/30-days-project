<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accordion</title>

    <link rel="stylesheet" href="main.css">
</head>

<body>

    <div class="accordion">

        <div class="accordion-item">
            <button class="accordion-btn">What is HTML?</button>

            <div class="accordion-content">
                <p>HTML is used to create the structure of a webpage.</p>
            </div>
        </div>

        <div class="accordion-item">
            <button class="accordion-btn">What is CSS?</button>

            <div class="accordion-content">
                <p>CSS is used to style and design a webpage.</p>
            </div>
        </div>

        <div class="accordion-item">
            <button class="accordion-btn">What is JavaScript?</button>

            <div class="accordion-content">
                <p>JavaScript makes webpages interactive.</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
