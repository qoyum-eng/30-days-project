<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>💰 Smart Expense Tracker</h1>
            <button class="dark-button" onclick="toggleDarkMode()">
            🌙 Dark Mode
        </button>
    </header>
    <!-- ADD EXPENSE -->
    <div class="card">
        <h2>Add Expense</h2>
        <div class="form-grid">
            <input
                id="expenseName"
                type="text"
                placeholder="What did you spend on?"
            >
            <input
                id="expenseAmount"
                type="number"
                placeholder="Amount (₦)"
            >
            <select id="expenseCategory">
                <option value="Food">🍔 Food</option>
                <option value="Transport">🚌 Transport</option>
                <option value="Shopping">🛍️ Shopping</option>
                <option value="Bills">💡 Bills</option>
                <option value="Data">📱 Data</option>
                <option value="Entertainment">🎮 Entertainment</option>
                <option value="Education">📚 Education</option>
                <option value="Other">📦 Other</option>
            </select>
            <input
                id="expenseDate"
                type="date"
            >
        </div>
        <button
            class="add-button"
            onclick="addExpense()"
        >
            ➕ Add Expense
        </button>
    </div>
    <!-- SUMMARY -->
    <div class="summary">
        <div class="summary-box">
            <h3>Total Spent</h3>
            <p id="total">
                ₦0
            </p>
        </div>
        <div class="summary-box">
            <h3>Number of Expenses</h3>
            <p id="expenseCount">
                0
            </p>
        </div>
        <div class="summary-box">
            <h3>Average Expense</h3>
            <p id="average">
                ₦0
            </p>
        </div>
    </div>
    <!-- BUDGET -->
    <div class="card">
        <h2>🎯 Monthly Budget</h2>
        <div class="budget-row">
            <input
                id="budget"
                type="number"
                placeholder="Enter your budget"
            >
            <button onclick="setBudget()">
                Set Budget
            </button>
        </div>
        <p id="budgetText">
            No budget set.
        </p>
        <div class="progress-container">
            <div
            id="progress"
            class="progress"
            ></div>
        </div>
    </div>
    <!-- SEARCH -->
    <div class="card">
        <h2>🔎 Find Expenses</h2>
        <div class="search-area">
            <input
                id="search"
                type="text"
                placeholder="Search expenses..."
                oninput="displayExpenses()"
            >
            <select
                id="filterCategory"
                onchange="displayExpenses()"
            >
                <option value="All">
                    All Categories
                </option>
                <option value="Food">
                    Food
                </option>
                <option value="Transport">
                    Transport
                </option>
                <option value="Shopping">
                    Shopping
                </option>
                <option value="Bills">
                    Bills
                </option>
                <option value="Data">
                    Data
                </option>
                <option value="Entertainment">
                    Entertainment
                </option>
                <option value="Education">
                    Education
                </option>
                <option value="Other">
                    Other
                </option>
            </select>
        </div>
    </div>
    <!-- EXPENSE LIST -->
    <div class="card">
        <h2>📋 Your Expenses</h2>
        <div id="expenseList"></div>
    </div>
    <!-- CATEGORY REPORT -->
    <div class="card">
        <h2>📊 Spending by Category</h2>
        <div id="categoryChart"></div>
    </div>
</div>
    <script src="script.js"></script>
</body>
</html>
